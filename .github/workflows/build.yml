name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check for binaries
        run: |
          echo "Checking for binaries..."
          if [ -f "app/src/main/jniLibs/arm64-v8a/libytdlp.so" ]; then
            echo "yt-dlp binary found"
          else
            echo "WARNING: yt-dlp binary NOT found"
          fi
          if [ -f "app/src/main/jniLibs/arm64-v8a/libffmpeg.so" ]; then
            echo "ffmpeg binary found"
          else
            echo "WARNING: ffmpeg binary NOT found"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
